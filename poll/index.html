<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Polls - The Feral Collective</title>
<meta name="description" content="Monthly polls for The Feral Collective. Anonymous votes, fair play, and nobody wins more than 3 golds.">
<link rel="canonical" href="https://entertheferal.com/poll/">
<style>
@font-face{font-family:'ED Fairville';src:url(../fonts/ED-Fairville-Regular.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Archivo';src:url(../fonts/archivo-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Archivo';src:url(../fonts/archivo-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Archivo';src:url(../fonts/archivo-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(../fonts/ibm-plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(../fonts/ibm-plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--paper:#f6f5f1;--paper2:#ebeae3;--ink:#0b0b0b;--soft:#4a4944;--line:#c9c7bf;--red:#b3201a;--redi:#ff7a6e;
--bl:'ED Fairville','UnifrakturCook',Georgia,serif;--ar:'Archivo','Helvetica Neue',Arial,sans-serif;--mo:'IBM Plex Mono','Courier New',monospace;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--mo)}
button,a{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}a{text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:2px solid var(--ink);padding:max(10px,env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .mark{font-family:var(--bl);font-size:1.45rem;line-height:1}
.pill{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;border:2px solid var(--ink);padding:3px 9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--paper);color:var(--ink);padding:13px 18px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--paper);transition:opacity .15s}
.btn.line{background:transparent;color:var(--paper);border-color:var(--paper)}.btn.red{background:var(--redi);border-color:var(--redi);color:var(--ink)}
.btn.dk{background:var(--ink);color:var(--paper);border-color:var(--ink)}.btn.dkl{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* hero */
.hero{background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.hero .art{position:absolute;filter:invert(1);mix-blend-mode:screen;pointer-events:none;right:-6%;top:-12%;height:125%;opacity:.5;transform:rotate(8deg)}
.hero .art2{left:-10%;bottom:-34%;right:auto;top:auto;height:100%;opacity:.22;transform:rotate(-12deg) scaleX(-1)}
.hero .in{position:relative;display:grid;grid-template-columns:1.5fr 1fr;gap:34px;padding:clamp(1.8rem,4vw,3rem) 0 clamp(1.6rem,3vw,2.6rem)}
.eye{display:flex;align-items:center;gap:10px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}.eye i{width:10px;height:10px;background:var(--redi);transform:rotate(45deg);flex:none}
.hero h1{font:400 clamp(3rem,9vw,5.6rem)/.95 var(--bl);margin:.7rem 0 .5rem;text-wrap:balance}
.hero .sub{font-family:var(--ar);font-size:1.05rem;color:#d8d6cf;max-width:34rem;margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.track{list-style:none;margin:26px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.track li{border-top:3px solid #3a3a37;padding:9px 12px 0 0;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#8f8d86}
.track li b{display:block;font-weight:500;color:inherit}.track li small{display:block;letter-spacing:.04em;text-transform:none;font-size:.7rem;margin-top:2px}
.track li.done{border-color:var(--paper);color:#c9c7bf}.track li.now{border-color:var(--redi);color:var(--paper)}
.me{background:var(--paper);color:var(--ink);border:2px solid var(--paper);padding:16px 16px 18px;align-self:start}
.me .k{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.me h2{font:400 2.1rem/1 var(--bl);margin:.35rem 0 .4rem}.me p{font-family:var(--ar);margin:0 0 8px;font-size:.92rem;color:var(--soft)}
.bar2{height:8px;background:var(--line);margin:10px 0 4px;position:relative}.bar2 b{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.me small{font-size:.7rem;color:var(--soft)}
.fair{display:flex;gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:12px 0;font-family:var(--ar);font-size:.9rem}
.fair span::before{content:"";display:inline-block;width:8px;height:8px;background:var(--red);transform:rotate(45deg);margin-right:8px}
.fair a{margin-left:auto;text-decoration:underline;text-underline-offset:3px}
/* past */
section.past{padding-top:clamp(2.2rem,5vw,3.4rem)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:.45rem;margin:0 0 1.2rem;flex-wrap:wrap}
.sh h2{font:400 clamp(2.2rem,5vw,3rem)/1 var(--bl);margin:0}.sh small{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pc{border:2px solid var(--ink);background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:16px 16px 14px;min-height:15rem}
.pc .art{position:absolute;right:-10%;top:-14%;height:78%;mix-blend-mode:multiply;opacity:.9;pointer-events:none}
.pc>*{position:relative}
.pc .d{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px solid var(--red);color:var(--red);padding:0 6px;font-size:.6rem}
.pc h3{font:400 clamp(2rem,4vw,2.7rem)/.98 var(--bl);margin:.1rem 0 0;max-width:15ch}
.pc p{font-family:var(--ar);margin:0;color:var(--soft);font-size:.92rem;max-width:26rem}
.nums{display:flex;gap:18px;align-items:flex-end;margin-top:auto;flex-wrap:wrap}
.nums div{display:flex;align-items:flex-end;gap:7px;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}.nums img{height:2.4rem;mix-blend-mode:multiply}
.you{font-size:.72rem;border-top:1px solid var(--line);padding-top:8px;font-family:var(--ar);font-weight:600}
.pc .go{align-self:flex-start;margin-top:4px}
.empty{border:2px dashed var(--ink);padding:18px;font-family:var(--ar);color:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;min-height:15rem}
footer{margin-top:clamp(3rem,6vw,5rem);background:var(--ink);color:var(--paper);padding:2.2rem 0 2.6rem;position:relative;overflow:hidden}
footer .art{position:absolute;right:-8%;top:-30%;height:170%;filter:invert(1);mix-blend-mode:screen;opacity:.4;pointer-events:none}
footer .in{position:relative}footer b{font:400 clamp(2.2rem,6vw,3.6rem)/1 var(--bl);display:block}footer p{margin:.5rem 0 0;color:#c9c7bf;font-family:var(--ar);max-width:34rem}
.tabbar{display:none}
@media(max-width:760px){
 .wrap{padding:0 16px}.bar{padding-left:16px;padding-right:16px}
 .hero .in{grid-template-columns:1fr;gap:22px}.hero .art{height:70%;right:-26%;opacity:.28}
 .track{grid-template-columns:1fr 1fr;row-gap:12px}
 .grid{grid-template-columns:1fr}
 body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
 .tabbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
 .tabbar button{padding:12px 6px;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px}
 .tabbar button i{width:10px;height:10px;border:2px solid var(--ink);transform:rotate(45deg)}
 .tabbar button[aria-selected=true]{background:var(--ink);color:var(--paper)}.tabbar button[aria-selected=true] i{background:var(--redi);border-color:var(--redi)}
 body[data-tab=now] #past,body[data-tab=past] #now{display:none}
 body[data-tab=past] footer{margin-top:2rem}
}
.loading{min-height:200px;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--soft);letter-spacing:.1em;text-transform:uppercase}
</style></head><body data-tab="now">
<header class="bar"><a href="/" class="mark">the Feral Collective</a><span class="pill">Polls</span></header>
<main>
<div id="now"><div class="hero"><img class="art" src="/poll/art/loop.webp" alt=""><img class="art art2" src="/poll/art/drip.webp" alt=""><div class="wrap"><div class="in" id="heroIn"><div class="loading">loading...</div></div></div></div>
<div class="wrap"><div class="fair"><span>anonymous votes</span><span>nobody wins more than 3 golds</span><span>you have to join to play</span><a href="/poll/rules/">read the rules</a></div></div></div>
<section class="past wrap" id="past"><div class="sh"><h2>past polls</h2><small id="pcount"></small></div><div class="grid" id="pgrid"><div class="loading">loading...</div></div></section>
</main>
<footer><img class="art" src="/poll/art/bold.webp" alt=""><div class="wrap"><div class="in"><b>Next one is always coming.</b><p>One poll a month. Join in, send ideas, vote, find out who gets us all killed.</p></div></div></footer>
<nav class="tabbar" id="tb" role="tablist" aria-label="Polls"><button role="tab" data-t="now" aria-selected="true"><i></i>This month</button><button role="tab" data-t="past" aria-selected="false"><i></i>Past polls</button></nav>

<script>
// Inline polls data - generated by npm run polls-index
var POLLS_DATA = {"current":null,"polls":[{"slug":"halloween-2026","title":"Halloween Horror Movie Poll","month":"oct 2026","line":"who survives the horror movie and who gets us all killed.","status":"published","resultsUrl":"/poll/halloween-2026/","art":"loop","awards":27,"peopleWithGold":20}]};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
(function() {
  'use strict';

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function dg(n) {
    return String(n).split('').map(function(c) {
      return '<img src="/poll/icons/n' + c + '.webp" alt="">';
    }).join('');
  }

  function $(s) { return document.querySelector(s); }

  function getPhaseKey(status) {
    var keys = {
      'ideas_open': 'open',
      'curating': 'curating',
      'voting_open': 'voting',
      'closed': 'closed',
      'published': 'results'
    };
    return keys[status] || 'none';
  }

  var STEPS = [
    ['Join', 'closes soon'],
    ['Ideas', 'close soon'],
    ['Voting', 'opens soon'],
    ['Results', 'after voting']
  ];

  var S = {
    open: {
      pill: 'joining and ideas open',
      tr: ['now', 'now', 'todo', 'todo']
    },
    curating: {
      pill: 'picking the final list',
      tr: ['done', 'done', 'todo', 'todo']
    },
    voting: {
      pill: 'voting open',
      tr: ['done', 'done', 'now', 'todo']
    },
    closed: {
      pill: 'voting closed',
      tr: ['done', 'done', 'done', 'now']
    },
    results: {
      pill: 'results are up',
      tr: ['done', 'done', 'done', 'done']
    },
    none: {
      pill: 'between polls',
      tr: ['todo', 'todo', 'todo', 'todo']
    }
  };

  function btn(txt, cls, href, disabled) {
    if (disabled) {
      return '<button class="btn ' + cls + '" disabled>' + txt + '</button>';
    }
    return '<a class="btn ' + cls + '" href="' + esc(href || '#') + '">' + txt + '</a>';
  }

  function renderHero(poll, user) {
    var state = poll ? getPhaseKey(poll.status) : 'none';
    var c = S[state];
    var title = poll ? poll.title : 'Next poll soon';
    var sub = poll ? (poll.topic || 'join in, send ideas, vote.') : "we'll email you when joining opens.";

    var cta = '';
    var mk = '';
    var mh = '';
    var mp = '';
    var showBar = false;

    // Determine member state
    // For now: not logged in = 'out', logged in = 'out' (no joining system yet)
    var you = 'out';
    if (!user) {
      you = 'guest'; // Special state for signed-out visitors
    }

    if (state === 'open') {
      if (you === 'guest') {
        cta = btn('log in to join', 'red', '/login/') + btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = 'not logged in';
        mp = 'log in to join this poll and suggest ideas.';
      } else if (you === 'out') {
        // Logged in but joining not open yet (system not live)
        cta = btn('joining opens soon', 'red', null, true) + btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = 'not in yet';
        mp = 'joining opens soon. you have to join to suggest ideas and vote.';
      } else {
        cta = btn('suggest an idea', 'red', '/poll/ideas/') + btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = "you're in.";
        mp = 'send up to 3 ideas.';
        showBar = true;
      }
    } else if (state === 'curating') {
      if (you === 'guest') {
        cta = btn('log in', 'red', '/login/') + btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = 'not logged in';
        mp = 'log in to see if you joined.';
      } else {
        cta = btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = you === 'out' ? 'not in' : "you're in.";
        mp = you === 'out' ? 'joining is closed.' : "we're choosing the final list. voting opens soon.";
        showBar = you !== 'out';
      }
    } else if (state === 'voting') {
      if (you === 'guest') {
        cta = btn('log in', 'red', '/login/') + btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = 'not logged in';
        mp = 'you can read the results when they go up.';
      } else if (you === 'voted') {
        cta = btn('edit my votes', 'red', '/poll/vote/');
        mk = 'your status';
        mh = 'voted.';
        mp = 'you can change your votes until voting closes.';
        showBar = true;
      } else if (you === 'in') {
        cta = btn('vote now', 'red', '/poll/vote/');
        mk = 'your status';
        mh = 'your ballot is open';
        mp = 'skip any you want. closes soon.';
        showBar = true;
      } else {
        cta = btn('read the rules', 'line', '/poll/rules/');
        mk = 'your status';
        mh = 'joining closed';
        mp = 'you can read the results when they go up.';
      }
    } else if (state === 'closed') {
      cta = btn('read the rules', 'line', '/poll/rules/');
      mk = 'your status';
      mh = you === 'out' || you === 'guest' ? 'not in' : 'thanks for voting';
      mp = 'results go up when we publish them.';
    } else if (state === 'results') {
      cta = btn('see results', 'red', poll ? poll.resultsUrl : '#');
      mk = 'your status';
      mh = you === 'out' || you === 'guest' ? 'not in' : 'see how you did';
      mp = you === 'out' || you === 'guest' ? 'you can still read the results.' : 'find your name on the results page.';
    } else {
      // none - between polls
      cta = btn('read the rules', 'line', '/poll/rules/');
      mk = "what's next";
      mh = 'coming soon';
      mp = "one poll a month. we'll tell you when it opens.";
    }

    // Build progress tracker
    var tr = '<ul class="track">' + STEPS.map(function(s, i) {
      return '<li class="' + c.tr[i] + '"><b>' + s[0] + '</b><small>' + (state === 'none' ? '—' : s[1]) + '</small></li>';
    }).join('') + '</ul>';

    // Build member status card
    var joined = showBar
      ? '<div class="bar2" aria-hidden="true"><b style="width:65%"></b></div><small>members joined</small>'
      : '';

    $('#heroIn').innerHTML =
      '<div>' +
        '<div class="eye"><i></i>' + esc(c.pill) + '</div>' +
        '<h1>' + esc(title) + '</h1>' +
        '<p class="sub">' + esc(sub) + '</p>' +
        '<div class="cta">' + cta + '</div>' +
        tr +
      '</div>' +
      '<aside class="me" aria-label="Your status">' +
        '<div class="k">' + mk + '</div>' +
        '<h2>' + mh + '</h2>' +
        '<p>' + mp + '</p>' +
        joined +
      '</aside>';
  }

  function renderPastPolls(polls, memberStats) {
    var list = polls || [];

    $('#pcount').textContent = list.length ? list.length + (list.length === 1 ? ' poll' : ' polls') : '';

    if (list.length === 0) {
      $('#pgrid').innerHTML = '<div class="empty">more polls will show up here as we run them.</div>';
      return;
    }

    var html = list.map(function(p) {
      var artMap = { loop: 'loop', drip: 'drip', bold: 'bold', red: 'red' };
      var artFile = artMap[p.art] || 'loop';

      // Check for member participation
      var stats = memberStats && memberStats[p.slug];
      var youLine = '';
      if (stats) {
        if (stats.goldCount > 0) {
          youLine = '<div class="you">you won ' + stats.goldCount + ' gold' + (stats.goldCount === 1 ? '' : 's') + '</div>';
        } else if (stats.inPoll) {
          youLine = '<div class="you">you were in this one</div>';
        }
      }

      return '<article class="pc">' +
        '<img class="art" src="/poll/art/' + artFile + '.webp" alt="">' +
        '<div class="d">' + esc(p.month) + '</div>' +
        '<h3>' + esc(p.title) + '</h3>' +
        '<p>' + esc(p.line) + '</p>' +
        '<div class="nums">' +
          '<div>' + dg(p.awards) + 'awards</div>' +
          '<div>' + dg(p.peopleWithGold) + 'people got a gold</div>' +
        '</div>' +
        youLine +
        '<a class="btn dk go" href="' + esc(p.resultsUrl) + '">see results</a>' +
      '</article>';
    }).join('');

    // Add empty state if only one poll
    if (list.length < 2) {
      html += '<div class="empty">more polls will show up here as we run them.</div>';
    }

    $('#pgrid').innerHTML = html;
  }

  async function init() {
    // Set up tabbar
    var tb = document.querySelectorAll('#tb button');
    tb.forEach(function(b) {
      b.onclick = function() {
        document.body.dataset.tab = b.dataset.t;
        tb.forEach(function(x) {
          x.setAttribute('aria-selected', x === b);
        });
        window.scrollTo(0, 0);
      };
    });

    // Get user state
    var user = null;
    try {
      if (typeof FeralAuth !== 'undefined') {
        user = await FeralAuth.getUser();
      }
    } catch (e) {
      console.warn('Auth not available:', e);
    }

    // Load poll data from inline POLLS_DATA
    var currentPoll = POLLS_DATA.current || null;
    var pastPolls = POLLS_DATA.polls.filter(function(p) { return p.status === 'published'; });

    // Get member stats for past polls (if logged in)
    // For now, this is empty - will be populated when we have live data
    var memberStats = {};

    // Render
    renderHero(currentPoll, user);
    renderPastPolls(pastPolls, memberStats);
  }

  init().catch(function(e) {
    console.error('Init failed:', e);
    // Render fallback state
    renderHero(null, null);
    renderPastPolls([], {});
  });
})();
</script>
</body></html>
