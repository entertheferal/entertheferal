<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curate Poll - Admin - The Feral Collective</title>
<style>
@font-face{font-family:'ED Fairville';src:url(../../../fonts/ED-Fairville-Regular.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Archivo';src:url(../../../fonts/archivo-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Archivo';src:url(../../../fonts/archivo-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(../../../fonts/ibm-plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(../../../fonts/ibm-plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--paper:#f6f5f1;--paper-2:#ebeae3;--ink:#0b0b0b;--ink-soft:#4a4944;--line:#c9c7bf;--red:#b3201a;--green:#1a7a3a;--yellow:#b89c2e;
--black:'ED Fairville',Georgia,serif;--archivo:'Archivo',sans-serif;--mono:'IBM Plex Mono',monospace}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--mono);padding:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;border-bottom:1.5px solid var(--ink)}
.mark{font-family:var(--black);font-size:1.6rem;line-height:1;text-decoration:none;color:inherit}
.header-menu{display:flex;align-items:center;gap:1rem}
.header-menu a,.header-menu button{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink);background:none;border:0;padding:.3rem 0;border-bottom:1.5px solid transparent}
.header-menu a:hover,.header-menu button:hover{border-bottom-color:var(--ink)}

.wrap{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
h1{font-family:var(--black);font-weight:400;font-size:clamp(2rem,5vw,2.8rem);line-height:1;margin:0 0 .3rem}
.subtitle{font-size:.85rem;color:var(--ink-soft);margin-bottom:1.5rem}
.poll-status{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .7rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--ink)}

.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

.card{border:2px solid var(--ink);padding:1.25rem;margin-bottom:1.5rem}
.card h2{font-family:var(--black);font-weight:400;font-size:1.5rem;margin:0 0 1rem;line-height:1}

.field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:.9rem}
.field label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field select,.field textarea{background:var(--paper);border:1.5px solid var(--ink);padding:.6rem .7rem;font-size:.9rem}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.6rem;padding:.5rem 1.2rem;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.85rem;letter-spacing:.04em;text-decoration:none}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.outline{background:transparent;color:var(--ink)}
.btn.outline:hover{background:var(--ink);color:var(--paper)}
.btn.small{min-height:2.2rem;padding:.4rem .8rem;font-size:.75rem}
.btn.warn{border-color:var(--red);background:var(--red)}
.btn.warn:hover{background:var(--paper);color:var(--red)}
.btn.success{border-color:var(--green);background:var(--green)}
.btn.success:hover{background:var(--paper);color:var(--green)}

.msg{padding:.6rem .8rem;border:1.5px solid var(--line);font-size:.82rem;margin-bottom:1rem}
.msg.bad{border-color:var(--red);color:var(--red)}
.msg.ok{border-color:var(--green);color:var(--green)}
.msg.warn{border-color:var(--yellow);color:var(--yellow)}

.ideas-list{border:2px solid var(--ink)}
.ideas-empty{padding:1.5rem;color:var(--ink-soft);text-align:center}

.idea{display:flex;gap:1rem;padding:1rem;border-bottom:1px solid var(--line);align-items:flex-start}
.idea:last-child{border-bottom:0}
.idea.accepted{background:rgba(26,122,58,.05)}
.idea.declined{opacity:.5}
.idea-vote{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-width:2.5rem}
.vote-count{font-size:.9rem;font-weight:500}
.idea-content{flex:1;min-width:0}
.idea-text{font-size:.92rem;margin:0 0 .4rem;word-break:break-word}
.idea-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;font-size:.75rem;color:var(--ink-soft)}
.idea-author{font-weight:500}
.idea-flag{color:var(--red)}
.idea-actions{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}

.tag{display:inline-flex;padding:.12rem .4rem;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--ink)}
.tag.accepted{background:var(--green);color:#fff;border-color:var(--green)}
.tag.declined{background:var(--red);color:#fff;border-color:var(--red)}
.tag.pending{background:var(--paper-2);color:var(--ink-soft)}

.stat-row{display:flex;justify-content:space-between;padding:.6rem 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-label{color:var(--ink-soft)}
.stat-value{font-weight:500}

.check-item{display:flex;align-items:center;gap:.5rem;padding:.5rem 0}
.check-icon{width:20px;height:20px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.check-icon.ok{background:var(--green);border-color:var(--green);color:#fff}
.check-icon.bad{background:var(--red);border-color:var(--red);color:#fff}

.categories-list{margin-top:1rem}
.category-item{display:flex;gap:.5rem;align-items:center;padding:.5rem;background:var(--paper-2);margin-bottom:.5rem}
.category-pos{font-family:var(--black);font-size:1.2rem;min-width:1.5rem}
.category-title{flex:1;font-size:.88rem}
.category-remove{background:none;border:0;font-size:1rem;padding:.25rem;color:var(--red)}

.loading{padding:3rem;text-align:center;color:var(--ink-soft)}
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="mark">the Feral Collective</a>
  <nav class="header-menu" id="headerMenu"></nav>
</header>

<div class="wrap">
  <div id="loading" class="loading">Loading...</div>

  <div id="content" hidden>
    <h1 id="pollTitle">Curate Poll</h1>
    <p class="subtitle">
      <span class="poll-status" id="pollStatus">Draft</span>
    </p>

    <div class="grid">
      <!-- Ideas Column -->
      <div>
        <div class="card">
          <h2>Ideas (<span id="ideaCount">0</span>)</h2>
          <div class="ideas-list" id="ideasList">
            <div class="ideas-empty">No ideas yet.</div>
          </div>
        </div>
      </div>

      <!-- Control Panel -->
      <div>
        <div class="card">
          <h2>Ballot</h2>
          <div id="ballotStats">
            <div class="stat-row">
              <span class="stat-label">Accepted categories</span>
              <span class="stat-value" id="acceptedCount">0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Target range</span>
              <span class="stat-value" id="categoryRange">12-20</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Participants</span>
              <span class="stat-value" id="participantCount">0</span>
            </div>
          </div>
          <div class="categories-list" id="categoriesList"></div>
        </div>

        <div class="card">
          <h2>Dates</h2>
          <div class="field">
            <label for="joinCloseAt">Join closes at</label>
            <input type="datetime-local" id="joinCloseAt">
          </div>
          <div class="field">
            <label for="ideasCloseAt">Ideas close at</label>
            <input type="datetime-local" id="ideasCloseAt">
          </div>
          <button type="button" class="btn small outline" id="saveDatesBtn">Save dates</button>
          <div class="msg" id="datesMsg" hidden></div>
        </div>

        <div class="card">
          <h2>Status Transitions</h2>
          <div id="transitionChecks"></div>
          <div class="msg" id="transitionMsg" hidden></div>
          <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem">
            <button type="button" class="btn small" id="closeIdeasBtn" hidden>Close ideas</button>
            <button type="button" class="btn small success" id="openVotingBtn" hidden>Open voting</button>
            <button type="button" class="btn small outline" id="backToIdeasBtn" hidden>Back to ideas</button>
          </div>
        </div>

        <div class="msg" id="errorMsg" hidden></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../../js/supabase-config.js"></script>
<script src="../../../js/auth.js"></script>
<script src="../../../js/poll.js"></script>
<script>
(function() {
  'use strict';

  let poll = null;
  let ideas = [];
  let categories = [];

  function esc(str) {
    if (str == null) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function init() {
    await FeralAuth.renderHeader('headerMenu');

    const user = await FeralAuth.getUser();
    if (!user) {
      window.location.href = '/login/?redirect=/admin/poll/curate/';
      return;
    }
    const isAdmin = await FeralAuth.isAdmin();
    if (!isAdmin) {
      window.location.href = '/';
      return;
    }

    poll = await FeralPoll.getCurrentPoll();

    document.getElementById('loading').hidden = true;
    document.getElementById('content').hidden = false;

    if (!poll) {
      showError('No active poll. Create one first.');
      return;
    }

    document.getElementById('pollTitle').textContent = poll.title || 'Curate Poll';
    document.getElementById('pollStatus').textContent = FeralPoll.getPollPhaseLabel(poll);
    document.getElementById('categoryRange').textContent = `${poll.settings?.min_categories || 12}-${poll.settings?.max_categories || 20}`;

    // Set dates
    if (poll.join_close_at) {
      document.getElementById('joinCloseAt').value = formatDatetimeLocal(poll.join_close_at);
    }
    if (poll.ideas_close_at) {
      document.getElementById('ideasCloseAt').value = formatDatetimeLocal(poll.ideas_close_at);
    }

    await loadData();
    setupHandlers();
    updateTransitionUI();
  }

  function formatDatetimeLocal(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    return d.toISOString().slice(0, 16);
  }

  async function loadData() {
    // Load ideas with admin details
    ideas = await FeralPoll.getIdeasAdmin(poll.id);
    document.getElementById('ideaCount').textContent = ideas.length;

    // Load stats
    const stats = await FeralPoll.getPollStats(poll.id);
    document.getElementById('participantCount').textContent = stats?.participants || 0;
    document.getElementById('acceptedCount').textContent = stats?.categories || 0;

    // Load categories
    const sb = FeralAuth.getSupabase();
    const { data: cats } = await sb
      .from('categories')
      .select('*')
      .eq('poll_id', poll.id)
      .order('position');
    categories = cats || [];

    renderIdeas();
    renderCategories();
  }

  function renderIdeas() {
    const list = document.getElementById('ideasList');

    if (ideas.length === 0) {
      list.innerHTML = '<div class="ideas-empty">No ideas yet.</div>';
      return;
    }

    // Sort: pending first, then by upvotes
    const sorted = [...ideas].sort((a, b) => {
      if (a.status === 'pending' && b.status !== 'pending') return -1;
      if (a.status !== 'pending' && b.status === 'pending') return 1;
      return (b.upvote_count || 0) - (a.upvote_count || 0);
    });

    list.innerHTML = sorted.map(idea => {
      let statusTag = '';
      if (idea.status === 'accepted') statusTag = '<span class="tag accepted">Accepted</span>';
      else if (idea.status === 'declined') statusTag = '<span class="tag declined">Declined</span>';
      else statusTag = '<span class="tag pending">Pending</span>';

      const flagInfo = idea.flagged ? `<span class="idea-flag">Flagged: ${esc(idea.flag_reason || 'Unknown')}</span>` : '';

      return `
        <div class="idea ${idea.status}" data-id="${idea.id}">
          <div class="idea-vote">
            <span class="vote-count">${idea.upvote_count || 0}</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </div>
          <div class="idea-content">
            <p class="idea-text">${esc(idea.text)}</p>
            <div class="idea-meta">
              <span class="idea-author">@${esc(idea.author_handle)}</span>
              ${statusTag}
              ${flagInfo}
            </div>
            ${idea.status === 'pending' ? `
            <div class="idea-actions">
              <button type="button" class="btn small success" data-action="accept" data-id="${idea.id}">Accept</button>
              <button type="button" class="btn small warn" data-action="decline" data-id="${idea.id}">Decline</button>
            </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');

    // Action handlers
    list.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const ideaId = btn.dataset.id;
        const action = btn.dataset.action;
        const idea = ideas.find(i => i.id === ideaId);
        if (!idea) return;

        btn.disabled = true;

        if (action === 'accept') {
          // Update status and create category
          const { error: statusError } = await FeralPoll.updateIdeaStatus(ideaId, 'accepted');
          if (statusError) {
            showError(FeralPoll.friendlyError(statusError));
            btn.disabled = false;
            return;
          }

          const position = categories.length + 1;
          const { error: catError } = await FeralPoll.createCategory(poll.id, ideaId, idea.text, position);
          if (catError) {
            showError(FeralPoll.friendlyError(catError));
            btn.disabled = false;
            return;
          }

        } else if (action === 'decline') {
          const reason = prompt('Reason for declining (optional):');
          const { error } = await FeralPoll.updateIdeaStatus(ideaId, 'declined', reason);
          if (error) {
            showError(FeralPoll.friendlyError(error));
            btn.disabled = false;
            return;
          }
        }

        await loadData();
        updateTransitionUI();
      });
    });
  }

  function renderCategories() {
    const list = document.getElementById('categoriesList');

    if (categories.length === 0) {
      list.innerHTML = '<p style="color:var(--ink-soft);font-size:.85rem">No categories yet. Accept ideas to add them.</p>';
      return;
    }

    list.innerHTML = categories.map((cat, i) => `
      <div class="category-item" data-id="${cat.id}">
        <span class="category-pos">${i + 1}</span>
        <span class="category-title">${esc(cat.title)}</span>
      </div>
    `).join('');
  }

  function setupHandlers() {
    // Save dates
    document.getElementById('saveDatesBtn').addEventListener('click', async () => {
      const joinClose = document.getElementById('joinCloseAt').value;
      const ideasClose = document.getElementById('ideasCloseAt').value;

      const { error } = await FeralPoll.updatePoll(poll.id, {
        join_close_at: joinClose ? new Date(joinClose).toISOString() : null,
        ideas_close_at: ideasClose ? new Date(ideasClose).toISOString() : null
      });

      const msg = document.getElementById('datesMsg');
      if (error) {
        msg.textContent = FeralPoll.friendlyError(error);
        msg.className = 'msg bad';
      } else {
        msg.textContent = 'Dates saved.';
        msg.className = 'msg ok';
        poll.join_close_at = joinClose ? new Date(joinClose).toISOString() : null;
        poll.ideas_close_at = ideasClose ? new Date(ideasClose).toISOString() : null;
        updateTransitionUI();
      }
      msg.hidden = false;
    });

    // Close ideas
    document.getElementById('closeIdeasBtn').addEventListener('click', async () => {
      if (!confirm('Close idea submission and move to curating?')) return;

      const btn = document.getElementById('closeIdeasBtn');
      btn.disabled = true;

      const { error } = await FeralPoll.transitionPollStatus(poll.id, 'curating');

      if (error) {
        showTransitionError(FeralPoll.friendlyError(error));
        btn.disabled = false;
        return;
      }

      window.location.reload();
    });

    // Open voting
    document.getElementById('openVotingBtn').addEventListener('click', async () => {
      if (!confirm('Open voting? Participants will be locked and joining will close.')) return;

      const btn = document.getElementById('openVotingBtn');
      btn.disabled = true;

      const { error } = await FeralPoll.transitionPollStatus(poll.id, 'voting_open');

      if (error) {
        showTransitionError(FeralPoll.friendlyError(error));
        btn.disabled = false;
        return;
      }

      window.location.href = '/admin/poll/close/';
    });

    // Back to ideas
    document.getElementById('backToIdeasBtn').addEventListener('click', async () => {
      if (!confirm('Reopen idea submission?')) return;

      const btn = document.getElementById('backToIdeasBtn');
      btn.disabled = true;

      const { error } = await FeralPoll.transitionPollStatus(poll.id, 'ideas_open');

      if (error) {
        showTransitionError(FeralPoll.friendlyError(error));
        btn.disabled = false;
        return;
      }

      window.location.reload();
    });
  }

  function updateTransitionUI() {
    const checks = document.getElementById('transitionChecks');
    const closeIdeasBtn = document.getElementById('closeIdeasBtn');
    const openVotingBtn = document.getElementById('openVotingBtn');
    const backToIdeasBtn = document.getElementById('backToIdeasBtn');

    const minCats = poll.settings?.min_categories || 12;
    const minParticipants = poll.settings?.min_participants || 10;
    const catCount = categories.length;
    const stats = { participants: parseInt(document.getElementById('participantCount').textContent) || 0 };

    const joinClosed = poll.join_close_at && new Date(poll.join_close_at) < new Date();

    const checksHtml = [];

    if (poll.status === 'ideas_open') {
      closeIdeasBtn.hidden = false;
      openVotingBtn.hidden = true;
      backToIdeasBtn.hidden = true;
    } else if (poll.status === 'curating') {
      closeIdeasBtn.hidden = true;
      backToIdeasBtn.hidden = false;

      checksHtml.push(makeCheck(catCount >= minCats, `${catCount}/${minCats} categories`));
      checksHtml.push(makeCheck(stats.participants >= minParticipants, `${stats.participants}/${minParticipants} participants`));
      checksHtml.push(makeCheck(joinClosed, joinClosed ? 'Join window closed' : 'Join window still open'));

      const allPassing = catCount >= minCats && stats.participants >= minParticipants && joinClosed;
      openVotingBtn.hidden = false;
      openVotingBtn.disabled = !allPassing;
    } else {
      closeIdeasBtn.hidden = true;
      openVotingBtn.hidden = true;
      backToIdeasBtn.hidden = true;
    }

    checks.innerHTML = checksHtml.join('');
  }

  function makeCheck(ok, label) {
    const icon = ok
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>'
      : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    return `<div class="check-item"><div class="check-icon ${ok ? 'ok' : 'bad'}">${icon}</div><span>${esc(label)}</span></div>`;
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.className = 'msg bad';
    el.hidden = false;
  }

  function showTransitionError(msg) {
    const el = document.getElementById('transitionMsg');
    el.textContent = msg;
    el.className = 'msg bad';
    el.hidden = false;
  }

  init();
})();
</script>
</body>
</html>
