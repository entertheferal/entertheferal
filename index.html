<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Feral Collective</title>
<style>
@font-face{font-family:'ED Fairville';src:url(fonts/ED-Fairville-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-500.woff2) format('woff2');font-weight:500;font-display:swap}
/* Layout: poster. Blackletter wordmark upper-centre, one quiet line of mono beneath it, wet ink brush bleeding off the bottom edge. */
:root{
  --paper:#f6f5f1;
  --ink:#0b0b0b;
  --ink-soft:#4a4944;
  --display:'IBM Plex Mono','Courier New',monospace;
  --black:'ED Fairville','UnifrakturCook',Georgia,serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow-x:clip}
img{max-width:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden;position:relative;
}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2rem;position:relative}
.top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1.25rem,3vw,2rem);padding-top:clamp(2rem,8vh,5rem);min-width:0;width:100%}
.word{font-family:var(--black);font-weight:400;font-size:clamp(4rem,19vw,9.5rem);line-height:.95;letter-spacing:0;text-align:center;margin:0;text-wrap:balance}
.status{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.status b{font-family:var(--black);font-weight:400;font-size:clamp(1.9rem,4.5vw,3rem);line-height:1;letter-spacing:.01em}
.status span{font-size:clamp(.75rem,1.4vw,.85rem);letter-spacing:.08em;color:var(--ink-soft)}
.ink{
  width:100vw;max-width:none;height:clamp(220px,44vh,560px);
  object-fit:cover;object-position:50% 100%;display:block;pointer-events:none;
  position:relative;left:50%;transform:translateX(-50%);
  margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px));
}
/* glitch: still most of the time, short tearing bursts every few seconds */
.word{position:relative}
.word::before,.word::after{
  content:"the Feral\A Collective";white-space:pre;position:absolute;inset:0;text-align:center;
  pointer-events:none;opacity:0;
}
.word::before{color:var(--ink);animation:g1 5.5s steps(1,end) infinite}
.word::after{color:var(--ink-soft);animation:g2 5.5s steps(1,end) infinite .08s}
.word{animation:jit 5.5s steps(1,end) infinite}
@keyframes jit{0%,100%{transform:none}91%{transform:translateX(-3px) skewX(-2deg)}92%{transform:translateX(4px)}93%{transform:none}96%{transform:translateX(2px) skewX(3deg)}97%{transform:none}}
@keyframes g1{
  0%,90%,100%{opacity:0;clip-path:inset(0 0 0 0);transform:none}
  91%{opacity:1;clip-path:inset(8% 0 62% 0);transform:translateX(-14px)}
  92%{opacity:1;clip-path:inset(54% 0 22% 0);transform:translateX(16px)}
  93%{opacity:1;clip-path:inset(30% 0 48% 0);transform:translateX(-8px)}
  94%{opacity:0}
  96%{opacity:1;clip-path:inset(70% 0 6% 0);transform:translateX(12px)}
  97%{opacity:1;clip-path:inset(2% 0 80% 0);transform:translateX(-10px)}
  98%{opacity:0}
}
@keyframes g2{
  0%,90%,100%{opacity:0;clip-path:inset(0 0 0 0);transform:none}
  91%{opacity:.75;clip-path:inset(44% 0 36% 0);transform:translateX(18px)}
  92%{opacity:.75;clip-path:inset(12% 0 70% 0);transform:translateX(-12px)}
  93%{opacity:.75;clip-path:inset(76% 0 4% 0);transform:translateX(9px)}
  94%{opacity:0}
  96%{opacity:.75;clip-path:inset(36% 0 40% 0);transform:translateX(-16px)}
  97%{opacity:0}
}
@media (prefers-reduced-motion:reduce){.word,.word::before,.word::after{animation:none}}
.player{width:min(100%,420px);margin-top:clamp(.25rem,1.5vw,1rem)}
.player iframe{display:block;width:100%;height:80px;border:0;border-radius:12px}
.player a{display:block;text-align:center;margin-top:.6rem;font-size:.75rem;letter-spacing:.08em;color:var(--ink-soft)}
.player a:hover{color:var(--ink)}
.player-facade{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.player-facade button{background:var(--ink);color:var(--paper);border:2px solid var(--ink);padding:.8rem 1.5rem;font:inherit;font-size:.9rem;letter-spacing:.06em;cursor:pointer}
.player-facade button:hover{background:var(--paper);color:var(--ink)}
.player-facade .notice{font-size:.68rem;color:var(--ink-soft);text-align:center;max-width:28ch}

/* ---------- ink decorations (hand-made assets) ---------- */
.d{position:absolute;display:block;max-width:none;height:auto;pointer-events:none;user-select:none;mix-blend-mode:multiply;opacity:0;animation:dIn 1.4s ease forwards}
@keyframes dIn{from{opacity:0;transform:var(--t,none) translateY(12px)}to{opacity:var(--o,1);transform:var(--t,none)}}
.d.z0{z-index:0}.d.z1{z-index:1}.d.z3{z-index:3}
.top{position:relative;z-index:2}
.status b{position:relative;display:inline-block;padding:0 .3em .22em}
.status b::after{content:"";position:absolute;left:-6%;right:-6%;bottom:-.08em;height:.55em;background:url(images/deco/ul-29.webp) center/100% 100% no-repeat;mix-blend-mode:multiply;z-index:-1;opacity:.9}
.vbred{right:-7vw;top:34vh;width:25vw;--t:rotate(14deg);--o:1;transform:rotate(14deg);animation-delay:.5s}
.vbdrip{left:-6vw;top:40vh;width:19vw;--t:rotate(-12deg);--o:1;transform:rotate(-12deg);animation-delay:.6s}
.vbswirl{right:3vw;top:5vh;width:17vw;--t:rotate(96deg);--o:1;transform:rotate(96deg);animation-delay:.7s}
.hero-ink{z-index:4}
@media (max-width:760px){
  .vbswirl{display:none}
  }
@media (prefers-reduced-motion:reduce){.d{animation:none;opacity:var(--o,1)}}
</style>
</head>
<body>
<main>
  <img class="d z1 vbred" alt="" src="images/deco/vb-red.webp">
  <img class="d z1 vbdrip" alt="" src="images/deco/vb-drip.webp">
  <img class="d z1 vbswirl" alt="" src="images/deco/vb-swirl.webp">
  <div class="top">
    <h1 class="word">the Feral<br>Collective</h1>
    <p class="status"><b>Coming soon</b><span>Something wild is gathering.</span></p>
    <div class="player" id="player">
  <div class="player-facade" id="playerFacade">
    <button type="button" id="playBtn">Play Fade Away</button>
    <span class="notice">Loads Spotify, which may set cookies.</span>
  </div>
</div>
<script>
document.getElementById('playBtn').addEventListener('click', function() {
  var player = document.getElementById('player');
  player.innerHTML = '<iframe title="Fade Away by Logic on Spotify" src="https://open.spotify.com/embed/track/4QRWA5UqYU1st9aO0UfxOj?theme=0" loading="lazy" allow="encrypted-media; clipboard-write; fullscreen; picture-in-picture"></iframe><a href="https://open.spotify.com/track/4QRWA5UqYU1st9aO0UfxOj" target="_blank" rel="noopener">Now playing: Fade Away, Logic ↗</a>';
});
</script>
  </div>
  <img class="ink" alt="" src="images/ink.webp" width="2400" height="1000">
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script>
// Handle magic link auth callback
(function() {
  if (window.location.hash && window.location.hash.includes('access_token')) {
    var sb = window.supabase.createClient(window.FERAL.SUPABASE_URL, window.FERAL.SUPABASE_ANON_KEY);
    sb.auth.getSession().then(function(result) {
      if (result.data.session) {
        // Clear the hash
        history.replaceState(null, '', window.location.pathname);
        // Check for saved redirect URL
        var savedRedirect = localStorage.getItem('feral_redirect');
        if (savedRedirect && savedRedirect.startsWith('/')) {
          localStorage.removeItem('feral_redirect');
          window.location.href = savedRedirect;
          return;
        }
        // Get profile and redirect to profile page
        sb.from('profiles').select('handle').eq('id', result.data.session.user.id).single().then(function(p) {
          if (p.data && p.data.handle) {
            window.location.href = '/u/' + p.data.handle;
          } else {
            window.location.href = '/';
          }
        });
      }
    });
  }
})();
</script>
</body>
</html>
